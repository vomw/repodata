MaintainerNotes:
  AppAdded: 2026-03-24
  Method: github-release
  GHSkipPre: 1
  ApkMatch: /LTvLauncher-universal-release\.apk/i
  Fastlane: https://github.com/leanbitlab-org/LtvLauncher/blob/master/fastlane/metadata/android
  FastlaneFeatures: title,shortdesc,fulldescMD,changelogs,icon,screenshots
  IntentFilterIgnore:
    android.accessibilityservice.AccessibilityService: to capture the KEYCODE_HOME event on Android TV remotes
  PermIgnore:
    android.permission.REQUEST_DELETE_PACKAGES: to allow removing unwanted apps directly from the launcher
    android.permission.SYSTEM_ALERT_WINDOW: optional; to display popup banners/alert cards over other apps when a notification is received
  Status:
    - 2026-09-10 switch from arm64 to universal build, as many TVs are 32bit; see https://github.com/leanbitlab-org/LtvLauncher/issues/135

