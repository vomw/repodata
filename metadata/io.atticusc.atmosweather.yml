  PermIgnore:
    android.permission.ACCESS_COARSE_LOCATION: used to show the weather at the current (approximate) location
    android.permission.ACCESS_FINE_LOCATION: used to show the weather at the current (GPS) location
    android.permission.ACCESS_BACKGROUND_LOCATION: needed to obtain the current location when the app is in background
    android.permission.SCHEDULE_EXACT_ALARM: needed to run periodic calls to the NWS API for alerts
    android.permission.INTERNET: needed to get weather information and alerts
    android.permission.ACCESS_NETWORK_STATE: used to optimize background usage (connect only when network available, check location less frequently when on WiFi)
    android.permission.POST_NOTIFICATIONS: used to display notifications for weather alerts for devices running Android 13 or higher
    android.permission.RECEIVE_BOOT_COMPLETED: used to restart the weather alert checks after the device is rebooted
