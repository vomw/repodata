MaintainerNotes:
  AppAdded: 2020-02-10
  Method: github-release
  GHSkipPre: 1
  ApkMatch: /cdr-arm64-v8a/i
  Fastlane: https://github.com/christianrowlands/android-network-survey/tree/develop/fastlane/metadata/android
  FastlaneFeatures: shortdesc,fulldesc,changelogs,icon,featureGraphic,screenshotsJPG
  DoubleList: keep
  PermIgnore:
    android.permission.ACCESS_COARSE_LOCATION: Needed to log your location during the survey, and also to get access to the cellular details.
    android.permission.ACCESS_FINE_LOCATION: Needed to log your location during the survey, especially also for GNSS constellations, and also to access Wi-Fi scans.
    android.permission.ACCESS_BACKGROUND_LOCATION: Needed to allow for starting logging when the phone is booted (strangely Android seems to need it). Can be denied if the „auto-start at boot“ feature is not needed.
    android.permission.BLUETOOTH_ADMIN: needed on Android 11 and below to start and cancel Bluetooth device discovery
    android.permission.BLUETOOTH_CONNECT: used to read the human-readable name field of a scanned device
    android.permission.BLUETOOTH_SCAN: Required for the feature of scanning and displaying a list of the nearby Bluetooth devices.
    android.permission.CAMERA: Required to scan QR Code for MQTT Broker connection setting.
    android.permission.READ_CALL_LOG: This is required for the CDR (Call Detail Record) feature, see https://github.com/christianrowlands/android-network-survey#cdr-log-files
    android.permission.READ_SMS: This is required for the CDR (Call Detail Record) feature, see https://github.com/christianrowlands/android-network-survey#cdr-log-files
    android.permission.READ_PHONE_NUMBERS: This is required for the CDR (Call Detail Record) feature, see https://github.com/christianrowlands/android-network-survey#cdr-log-files
    android.permission.READ_PHONE_STATE: Needed to log the connection state etc. during the survey – especially for cell tower details.
    android.permission.READ_EXTERNAL_STORAGE: Required to access the Download folder on Android 9 and below. The download folder is where log files are written to.
    android.permission.WRITE_EXTERNAL_STORAGE: needed on Android 12 and below to save survey data to GeoPackage or CSV files, and for logging
    android.permission.POST_NOTIFICATIONS: needed on Android 13+ to keep the service running in background
