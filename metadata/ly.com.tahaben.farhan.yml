    android.permission.SCHEDULE_EXACT_ALARM: for notify me, to notify you at an exact time
    android.permission.WAKE_LOCK: to keep usage caching process from sleeping
    android.permission.WRITE_SECURE_SETTINGS: to grayscale the screen
