MaintainerNotes:
  AppAdded: 2021-03-18
  Method: github-release
  GHSkipPre: 1
  Fastlane: https://github.com/christianrowlands/android-network-survey-rooted/tree/develop/fastlane/metadata/android
  FastlaneFeatures: shortdesc,fulldescMD,icon,featureGraphicJPG,screenshots
  PermIgnore:
    android.permission.ACCESS_COARSE_LOCATION: needed to tag each cellular OTA message in the pcap file with a lat/lon
    android.permission.ACCESS_FINE_LOCATION: needed to tag each cellular OTA message in the pcap file with a lat/lon
    android.permission.ACCESS_BACKGROUND_LOCATION: needed so the app can obtain the location even when running in background
    android.permission.WRITE_EXTERNAL_STORAGE: needed on Android 10 and below to save pcap files to the Downloads directory
    android.permission.READ_EXTERNAL_STORAGE: granted implicitly by WRITE_EXTERNAL_STORAGE
    android.permission.ACCESS_SUPERUSER: required to access the cellular modem to get the cellular OTA messages
    android.permission.FOREGROUND_SERVICE: needed to prevent Android from killing this app while capturing the cellular OTA messages to the pcap file
  Status:
    - 2022-11-07 no release since 9/2021, last code commit 9/2021; switch from Tags to Static

