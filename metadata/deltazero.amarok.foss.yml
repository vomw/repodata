    - /deltazero/amarok
  DoubleList: keep
  DoubleListRef: https://github.com/deltazefiro/Amarok-Hider/issues/2#issuecomment-1416731772
  PermIgnore:
    android.permission.READ_EXTERNAL_STORAGE: needed to access the files to hide
    android.permission.WRITE_EXTERNAL_STORAGE: needed to restore hidden files
    android.permission.MANAGE_EXTERNAL_STORAGE: needed on newer Android versions to access the files to hide
    android.permission.QUERY_ALL_PACKAGES: needed to list the apps to hide
    android.permission.SYSTEM_ALERT_WINDOW: needed for the display of a system-wide panic button aka BOSS key aka Quick Hide
  Status:
