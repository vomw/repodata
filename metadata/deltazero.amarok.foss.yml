    - 2022-12-28 fixed, but renamed from deltazero.amarok to deltazero.amarok.foss
    - 2023-02-04 app arrived at F-Droid. Asked whether we shall keep it as the badge linking to us is still present, see https://github.com/deltazefiro/Amarok-Hider/issues/2#issuecomment-1416731772
    - 2023-02-04 enabled pre-releases on request of author, see https://github.com/deltazefiro/Amarok-Hider/issues/2#issuecomment-1416745910
    - 2024-02-10 scanner reports READ_EXTERNAL_STORAGE MANAGE_EXTERNAL_STORAGE QUERY_ALL_PACKAGES SYSTEM_ALERT_WINDOW – https://github.com/deltazefiro/Amarok-Hider/issues/126

