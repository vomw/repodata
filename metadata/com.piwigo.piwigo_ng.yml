MaintainerNotes:
  AppAdded: 2022-03-18
  Method: github-release
  GHSkipPre: 1
  ApkMatch: /arm64-v8a/i
  Fastlane: https://github.com/Piwigo/piwigo-flutter-app/tree/master/fastlane/metadata/android
  FastlaneFeatures: shortdesc,fulldescMD,icon,featureGraphic,screenshots
  NameSpaces:
    - /com/remi/piwigo_ng
  FlagIgnore:
    usesCleartextTraffic: needed to access instances locally hosted without SSL
  PermIgnore:
    android.permission.READ_EXTERNAL_STORAGE: needed up to Android 9 to properly access media
    android.permission.READ_MEDIA_IMAGES: needed to access images
    android.permission.READ_MEDIA_VIDEO: needed to access videos
    android.permission.READ_MEDIA_AUDIO: needed to access audio files
    android.permission.CAMERA: for the integrated feature to shoot a photo
  Status:
    - 2025-06-20 v2.4.0 ships debug build, UCM Tags=>Static until solved; https://github.com/Piwigo/piwigo-flutter-app/issues/7
    - 2025-06-24 solved, but now APK doubled in size and is almost twice the per-app size limit
    - 2025-08-13 upstreaming our Fastlane via https://github.com/Piwigo/piwigo-flutter-app/pull/230
    - 2025-11-12 pinned to arm64 build, UCM back to Tags

