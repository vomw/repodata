    android.permission.REQUEST_INSTALL_PACKAGES: used by the opt-in update checker
    android.permission.READ_MEDIA_IMAGES: needed on newer Android versions to access on-device images for artwork
    android.permission.READ_MEDIA_VIDEO: needed on newer Android versions to fetch all videos from device
    android.permission.READ_MEDIA_AUDIO: needed on newer Android versions to fetch all songs from device
  Status:
