MaintainerNotes:
  AppAdded: 2025-07-25
  Method: github-release
  GHSkipPre: 1
  ApkMatch: /NoUpdater/i
  Fastlane: https://github.com/mitchib1440/SpeakThat/tree/main/fastlane/metadata/android
  FastlaneFeatures: shortdesc,fulldescMD,icon,featureGraphic,screenshots
  Note: FAstlane is our starter package
  IntentFilterIgnore:
    android.accessibilityservice.AccessibilityService: optionally used for some convenience features, once explicitly agreed
  PermIgnore:
    android.permission.ACCESS_COARSE_LOCATION: required for Bluetooth scanning on newer versions of Android
    android.permission.ACCESS_FINE_LOCATION: required for Bluetooth scanning on newer versions of Android
    android.permission.ACCESS_BACKGROUND_LOCATION: used to detect which WiFi network the device is connected to and block notification reading when connected to it
    android.permission.BLUETOOTH: used for the Conditional Rules feature
    android.permission.BLUETOOTH_ADMIN: used for the Conditional Rules feature
    android.permission.BLUETOOTH_CONNECT: used for the Conditional Rules feature
    android.permission.BLUETOOTH_SCAN: used for the Conditional Rules feature
    android.permission.NEARBY_WIFI_DEVICES: used for the Conditional Rules feature
    android.permission.ACCESS_WIFI_STATE: used for the Conditional Rules feature
    android.permission.ACCESS_NETWORK_STATE: used for the Conditional Rules feature
    android.permission.READ_EXTERNAL_STORAGE: used for the settings export/import feature
    android.permission.WRITE_EXTERNAL_STORAGE: used for the settings export/import feature
    android.permission.BIND_NOTIFICATION_LISTENER_SERVICE: to get informed about new notifications to speak
    android.permission.MODIFY_AUDIO_SETTINGS: for some TTS options, to eg. select an audio stream type and lower media volume when speaking
    android.permission.RECEIVE_BOOT_COMPLETED: to ensure the service gets enabled on device startup
    android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS: to prevent the system from stopping the app
    android.permission.INTERNET: to download TTS voices from the network
    android.permission.POST_NOTIFICATIONS: to have a persistent notification when the app is active, and another when it’s actively speaking
    android.permission.READ_PHONE_STATE: to keep the app from talking during phone calls
    android.permission.BIND_QUICK_SETTINGS_TILE: for a quick settings tile option to easily disable/enable SpeakThat
    android.permission.WAKE_LOCK: to prevent power saving shutting the app down when SpeakThat was exempted from power management
    android.permission.FOREGROUND_SERVICE: to keep SpeakThat from being killed by the system by allowing it to run as a foreground service
    android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK: similar to FOREGROUND_SERVICE
    android.permission.CHANGE_WIFI_STATE: to ensure WiFi is enabled, so SpeakThat can detect networks and wireless devices
    android.permission.BIND_ACCESSIBILITY_SERVICE: optionally used for some convenience features, once explicitly agreed
