MaintainerNotes:
  AppAdded: 2023-02-11
  Todo: 2026-11-16 might have to remove the app if https://github.com/T8RIN/ImageToolbox/issues/3124 (lite version; the current one is already > 110 MB) cannot be solved
  Method: github-release
  GHSkipPre: 1
  ApkMatch: /foss-arm64-v8a/i
  Fastlane: https://github.com/T8RIN/ImageToolbox/tree/master/fastlane/metadata/android
  FastlaneFeatures: shortdesc,fulldescMD,changelogs,icon,screenshotsJPG
  NameSpaces:
    - /com/t8rin/crop
    - /com/t8rin/cropper
    - /com/t8rin/gesture
    - /com/t8rin/imagetoolbox
    - /com/t8rin/snowfall
  FlagIgnore:
    usesCleartextTraffic: to scrape images from non-https websites, too
  PermIgnore:
    android.permission.READ_EXTERNAL_STORAGE: needed on Android 9 and below to access media
    android.permission.READ_MEDIA_IMAGES: well, it shall shrink your images, right?
    android.permission.MANAGE_EXTERNAL_STORAGE: used to read jxl and qoi files, which are not images according to the android system
    android.permission.ACCESS_MEDIA_LOCATION: needed to work with Exif data
    android.permission.CAMERA: needed for document scanner and qr code scanner features
    android.permission.READ_CONTACTS: to create QR codes from contacts
  DoubleList: keep
  DoubleListRef: https://github.com/T8RIN/ImageToolbox/issues/3#issuecomment-1510467235
  Status:
    - 2023-04-16 app reached F-Droid at 2023-04-06, asked whether to keep https://github.com/T8RIN/ImageResizer/issues/3#issuecomment-1510467235
    - 2023-08-29 disabled updates as proprietary components were added (7 offenders), see https://github.com/T8RIN/ImageToolbox/issues/412
    - 2023-09-01 updates re-enabled and ApkMatch adjusted to fetch the new FOSS variant
    - 2024-04-24 scanner reports android.permission.ACCESS_MEDIA_LOCATION – https://github.com/T8RIN/ImageToolbox/issues/997
    - 2024-07-07 adds android.permission.CAMERA (added to above issue)
    - 2025-03-09 android.permission.MANAGE_EXTERNAL_STORAGE – https://github.com/T8RIN/ImageToolbox/issues/1732
    - 2025-07-15 usesCleartextTraffic + broken fastlane description – https://github.com/T8RIN/ImageToolbox/issues/2060
    - 2026-08-19 APK size is really an issue here (currently ~85 MB). Dev still tries to find ways, see https://github.com/T8RIN/ImageToolbox/issues/2686#issuecomment-5007742282
    - 2026-09-05 4.2.0 sums up to 112 MB now, and adds JUnrar (NonFreeDep). Disabling updates for now; see https://github.com/T8RIN/ImageToolbox/issues/3124

