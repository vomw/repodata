MaintainerNotes:
  AppAdded: 2021-06-12
  Method: github-release
  GHSkipPre: 1
  ApkMatch: /foss-release/i
  ApkIgnore: /withUpdater/i
  Fastlane: https://github.com/rRemix/APlayer/tree/master/fastlane/metadata/android
  FastlaneFeatures: shortdesc,fulldescMD,icon,featureGraphic,screenshots
  PermIgnore:
    android.permission.READ_EXTERNAL_STORAGE: needed on lower Android version to access the music files to play
    android.permission.READ_MEDIA_AUDIO: needed on newer Android versions to access the music files to play
    android.permission.SYSTEM_ALERT_WINDOW: used to show lyrics in an overlay
  Status:
    - 2021-06-20 switching from Tags to Static as tag name (e.g. v1.5.7.7.1) does indicate a newer release not being there (1.5.7.7)
    - 2021-07-18 switching back to Tags while adjusting AUM accordingly
    - 2024-03-05 scanner reports DEPENDENCY_INFO_BLOCK MANAGE_EXTERNAL_STORAGE android.permission.REQUEST_INSTALL_PACKAGES READ_EXTERNAL_STORAGE SYSTEM_ALERT_WINDOW READ_MEDIA_AUDIO android.permission.READ_MEDIA_IMAGES – https://github.com/rRemix/APlayer/issues/227
    - 2025-08-23 upstreaming our local Fastlane metadata via https://github.com/rRemix/APlayer/pull/296
    - 2025-12-31 dev now provides build variant without updater, so no more REQUEST_INSTALL_PACKAGES
    - 2026-03-06 Bugly and BillingClient have been removed, so we dropped NonFreeComp, NonFreeNet, and Tracking
    - 2026-08-27 RB failed with huge diff, so UCM Tags=>Static until clarified
    - 2026-08-28 will be fixed with v2.1.1.1 (local mess-up), so we skip v2.1.1.0

