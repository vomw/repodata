  PermIgnore:
    android.permission.MANAGE_EXTERNAL_STORAGE: needed for backup storage
    android.permission.WRITE_EXTERNAL_STORAGE: needed for backup storage
    android.permission.READ_EXTERNAL_STORAGE: implicitly granted due to WRITE_EXTERNAL_STORAGE
    android.permission.QUERY_ALL_PACKAGES: needed to access the apps it shall back up
    android.permission.READ_SMS: needed to backup SMS
    android.permission.SEND_SMS: needed to restore SMS from backup
    android.permission.RECEIVE_SMS: needed to backup SMS
    android.permission.RECEIVE_MMS: needed to backup MMS
    android.permission.RECEIVE_WAP_PUSH: needed to restore MMS
    android.permission.READ_CONTACTS: needed to backup contacts
    android.permission.READ_CALL_LOG: needed to backup call logs
    android.permission.WRITE_CALL_LOG: needed to restore call logs
