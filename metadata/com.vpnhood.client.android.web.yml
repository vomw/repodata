MaintainerNotes:
  AppAdded: 2025-01-19
  Method: github-release
  GHSkipPre: 1
  ApkMatch: /android-arm64-web\.apk$/
  Fastlane: https://github.com/vpnhood/VpnHood/tree/main/fastlane/metadata/android
  FastlaneFeatures: title,shortdesc,fulldescMD,icon,featureGraphic,screenshots
  FastlaneIgnore: changelogs
  Note: Fastlane is our starter package; added changelogs are just default.txt
  FlagIgnore:
    usesCleartextTraffic: This is needed for *internal* traffic (the UI, running on localhost). All VpnHood outbound connections are strongly encrypted.
  IntentFilterIgnore:
    android.net.VpnService: This is a VPN client, so it needs the VpnService.
  PermIgnore:
    android.permission.QUERY_ALL_PACKAGES: This permission is needed to let the VPN client split tunnel traffic for specific apps, giving the flexibility to choose which apps use the tunnel.
