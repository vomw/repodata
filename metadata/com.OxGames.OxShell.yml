  GHSkipPre: 1
  IntentFilterIgnore:
    android.accessibilityservice.AccessibilityService: needed for the feature to open the app switcher using a gamepad
  PermIgnore:
    android.permission.REQUEST_INSTALL_PACKAGES: includes a file explorer, so this allows you to install APKs
    android.permission.REQUEST_DELETE_PACKAGES: needed to let you uninstall apps
    android.permission.READ_EXTERNAL_STORAGE: needed by the integrated file exlorer to browse all directories
    android.permission.MANAGE_EXTERNAL_STORAGE: needed by file managers with more recent Android versions
    android.permission.QUERY_ALL_PACKAGES: needed to list the apps for you to launch them
