    android.permission.READ_CONTACTS: Needed so you can pick the contact to call (phonebook).
    android.permission.WRITE_CONTACTS: Needed so you can update your contact list.
    android.permission.READ_PHONE_STATE: Well, this is a phone/calling app :)
    android.permission.READ_CALL_LOG: Needed to show your call history.
    android.permission.WRITE_CALL_LOG: As this is a dialer, it stores your call history there.
    android.permission.RECORD_AUDIO: It is hard to make a phone call without microphon ;)
    android.permission.SYSTEM_ALERT_WINDOW: To notify you about incoming calls.
