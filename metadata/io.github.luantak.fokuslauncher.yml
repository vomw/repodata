  PermIgnore:
    android.permission.REQUEST_DELETE_PACKAGES: to remove unwanted apps right from the launcher
    android.permission.ACCESS_COARSE_LOCATION: needed for the optional weather widget
    android.permission.INTERNET: to optionally fetch weather from OpenMeteo
    android.permission.ACCESS_HIDDEN_PROFILES: for a private Space apps in the drawer when unlocked
    android.permission.EXPAND_STATUS_BAR: to open notification shade from swipe-down gestures
    android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS: to optionally disable battery optimization (required for return home after long lock)
    android.permission.SET_WALLPAPER: to set image or solid black wallpaper from settings

