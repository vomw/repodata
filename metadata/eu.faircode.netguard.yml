    android.permission.QUERY_ALL_PACKAGES: needed for per-app rules
    android.permission.READ_PHONE_STATE: needed to detect mobile network changes
    android.permission.RECEIVE_BOOT_COMPLETED: needed to start the firewall when booting the device
    android.permission.VIBRATE: used to provide vibration feedback on widget tap
    android.permission.WAKE_LOCK: needed to reliably reload rules in the background on connectivity changes

