    android.permission.ACCESS_FINE_LOCATION: needed for NEARBY_WIFI_DEVICES, to see the Wi-Fi name
    android.permission.ACCESS_COARSE_LOCATION: needed for NEARBY_WIFI_DEVICES, to see the Wi-Fi name
    android.permission.ACCESS_BACKGROUND_LOCATION: needed for NEARBY_WIFI_DEVICES, to see the Wi-Fi name when the app runs in background
    android.permission.NEARBY_WIFI_DEVICES: required only for Wi-Fi Blocklist automation, to identify the Wi-Fi network name (SSID) locally
    android.permission.WRITE_SECURE_SETTINGS: required to modify system Private DNS settings. Must be granted via root or using ADB.
    android.permission.INTERNET: optionally used to verify that your Custom DNS Provider is online and reachable before applying it.

