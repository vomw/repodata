  FastlaneFeatures: title,shortdesc,fulldescMD,changelogs,icon,featureGraphic,screenshots
  IntentFilterIgnore:
    android.accessibilityservice.AccessibilityService: needed for the optional the double tap to lock feature
  PermIgnore:
    android.permission.QUERY_ALL_PACKAGES: needed so the launcher can display apps available on the device
    android.permission.ACCESS_COARSE_LOCATION: used to find the weather location
    android.permission.REQUEST_DELETE_PACKAGES: needed to be able to uninstall apps from within the drawer
    android.permission.READ_CONTACTS: for the optional contact search feature
  DoubleList: keep
