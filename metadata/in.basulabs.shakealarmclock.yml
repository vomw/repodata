  PermIgnore:
    android.permission.READ_MEDIA_AUDIO: used on newer Android versions to pick a custom alarm tone
    android.permission.READ_EXTERNAL_STORAGE: used on older Android versions to pick a custom alarm tone
    android.permission.USE_EXACT_ALARM: needed to that the system will wake up from doze mode when the alarm rings (Android 13+)
    android.permission.SCHEDULE_EXACT_ALARM: needed to that the system will wake up from doze mode when the alarm rings (Android 12)
    com.android.alarm.permission.SET_ALARM: required to set alarms
    android.permission.POST_NOTIFICATIONS: needed to post notifications and to e.g. show the „dismiss“ option when an alarm rings
    android.permission.ACCESS_NOTIFICATION_POLICY: needed to change the Do Not Disturb settings of the device to make sure that an alarm rings
    android.permission.VIBRATE: used to vibrate the device when alarm is ringing
    android.permission.WAKE_LOCK: needed to show alarm screen when an alarm is ringing
    android.permission.DISABLE_KEYGUARD: needed to the show alarm screen when an alarm is ringing
    android.permission.USE_FULL_SCREEN_INTENT: needed to the show alarm screen when an alarm is ringing
    android.permission.FOREGROUND_SERVICE: needed to ring the alarm and keep it snoozed
    android.permission.RECEIVE_BOOT_COMPLETED: needed to restore alarms when the device boots
    android.permission.FOREGROUND_SERVICE_SPECIAL_USE: needed to tell the system the type of foreground Service that the app uses
