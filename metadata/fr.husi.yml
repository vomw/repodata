    android.permission.CAMERA: for the integrated QR code scanner
    android.permission.ACCESS_COARSE_LOCATION: for retrieving WiFi information (can be denied if related enhancements are not needed)
    android.permission.ACCESS_FINE_LOCATION: for retrieving WiFi information (can be denied if related enhancements are not needed)
    android.permission.ACCESS_BACKGROUND_LOCATION: for retrieving WiFi information (can be denied if related enhancements are not needed)
    android.permission.NEARBY_WIFI_DEVICES: for retrieving WiFi information (can be denied if related enhancements are not needed)
  NameSpaces:
    - ignore_the_unkown_below
    - /go/libcore/gojni
