    - 2026-03-19 app repo moved to Codeberg, UCM=>Tags again
    - 2026-08-18 our quality checker found the repo archived, disabling updates
    - 2026-08-28 received a mail reporting the repo moved back to https://github.com/xchacha20-poly1305/husi – check confirmed, but 2 LLMs involved there. Most likely moved back because https://blog.codeberg.org/protecting-our-floss-commons-from-llms.html (timing matches)

