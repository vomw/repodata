MaintainerNotes:
  AppAdded: 2021-03-22
  Method: github-release
  GHSkipPre: 1
  Fastlane: https://github.com/apk-editor/APK-Explorer-Editor/tree/master/fastlane/metadata/android
  FastlaneFeatures: shortdesc,fulldescMD,changelogs,icon
  FastlaneIgnore: screenshots
  Note: Fastlane screenshots are framed
  DoubleList: keep
  PermIgnore:
    android.permission.REQUEST_INSTALL_PACKAGES: needed for the APK/Bundle installer component
    android.permission.QUERY_ALL_PACKAGES: needed to list the apps to explore
    android.permission.READ_EXTERNAL_STORAGE: needed to explore the storage for APK files
    android.permission.WRITE_EXTERNAL_STORAGE: needed to save/export files
  Status:
    - 2021-04-19 app removed as it arrived at F-Droid 2021-04-05, see https://gitlab.com/fdroid/rfp/-/issues/1678#note_536360024
    - 2021-09-06 restored at request of author, see https://gitlab.com/IzzyOnDroid/applists/-/issues/14#note_669819439
    - 2024-03-04 scanner reports android.permission.READ_PHONE_STATE DEPENDENCY_INFO_BLOCK – https://github.com/apk-editor/APK-Explorer-Editor/issues/73
    - 2026-09-07 RB failing for v0.36 with a huge diff in DEX, rolling back and disabling updates for now (also for RB); see https://github.com/apk-editor/APK-Explorer-Editor/issues/199#issuecomment-5575296524

