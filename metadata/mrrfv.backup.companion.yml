MaintainerNotes:
  AppAdded: 2022-01-09
  Method: github-release
  GHSkipPre: 1
  ApkMatch: /arm64-v8a/i
  Fastlane: https://github.com/mrrfv/open-android-backup/tree/master/fastlane/metadata/android
  FastlaneFeatures: shortdesc,fulldescMD,icon,screenshots
  PermIgnore:
    android.permission.READ_CONTACTS: Needed to backup contacts.
    android.permission.WRITE_CONTACTS: Needed to restore contacts from backups.
    android.permission.READ_EXTERNAL_STORAGE: Needed on Android versions lower than 6 to access backups on the device.
    android.permission.MANAGE_EXTERNAL_STORAGE: Needed to backup/restore files on newer Android versions.
    android.permission.READ_SMS: Needed to export SMS/MMS.
    android.permission.READ_CALL_LOG: Needed to export call logs.
    android.permission.WRITE_CALL_LOG: Needed to restore call logs from backups.
  Status:
    - 2023-07-25 rebranded from com.example.companion_app
    - 2023-09-15 versionCode decreased again – and signing key changed!!! https://github.com/mrrfv/open-android-backup/issues/49#issuecomment-1721702463
    - 2023-09-15 both keys are even debug keys, ouch! Setting UCM Tags => Static until solved and removing the offending APK.
    - 2023-10-02 re-enable updates, key validated via DNS
    - 2024-01-20 scanner reported READ_PHONE_STATE – https://github.com/mrrfv/open-android-backup/issues/101
    - 2025-01-26 added DEPENDENCY_INFO_BLOCK to the issue
    - 2025-08-22 upstreaming our local Fastlane metadata via https://github.com/mrrfv/open-android-backup/pull/145
    - 2026-01-24 now also comes with android.permission.READ_PHONE_NUMBERS, added that to issue 101 as well
    - 2026-04-06 APK size now approaching 45 MB. Asked for per-ABI splits at https://github.com/mrrfv/open-android-backup/issues/170

