  PermIgnore:
    android.permission.CAMERA: required to make photos
    android.permission.RECORD_AUDIO: required to record audio with videos
    android.permission.ACCESS_FINE_LOCATION: required to record the location to embed with metadata (GeoTagging)
    android.permission.ACCESS_COARSE_LOCATION: required to record the location to embed with metadata (GeoTagging)
    android.permission.INTERNET: for Nextcloud auto-backup
    android.permission.ACCESS_WIFI_STATE: to check if WiFi is available (to upload only then)
    android.permission.BLUETOOTH: to support Bluetooth remote shutter devices
    android.permission.BLUETOOTH_ADMIN: required to manage Bluetooth connections with remote shutter devices
    android.permission.BLUETOOTH_CONNECT: required to establish connection with paired Bluetooth remote shutters
    android.permission.BLUETOOTH_SCAN: to scan for Bluetooth remote shutter devices
    android.permission.WRITE_EXTERNAL_STORAGE: required to save photos/videos to device storage (legacy API support)
    android.permission.READ_EXTERNAL_STORAGE: required to access saved media for Nextcloud upload
    android.permission.ACCESS_NETWORK_STATE: to check network availability before attempting uploads

