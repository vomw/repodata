    android.permission.READ_EXTERNAL_STORAGE: to read audio files from device storage (downloads/local tracks) on Android 12 and below
    android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS: optionally used to open battery optimization settings on aggressive OEM devices
    android.permission.MANAGE_EXTERNAL_STORAGE: used only if the user opts in to manage local audio/downloaded songs directly from the app

