  AppAdded: 2024-11-05
  Method: gitlab-tags
  GHSkipPre: 1
  Fastlane: https://gitlab.com/AuroraOSS/AuroraStore/-/tree/master/fastlane/metadata/android
  FastlaneFeatures: shortdesc,fulldescNL,changelogs,icon,screenshots
  DoubleList: keep
  PermIgnore:
    android.permission.REQUEST_DELETE_PACKAGES: needed to uninstall apps
    android.permission.REQUEST_INSTALL_PACKAGES: needed to install/update apps
    android.permission.UPDATE_PACKAGES_WITHOUT_USER_ACTION: for seemless updates
    android.permission.QUERY_ALL_PACKAGES: needed to list apps for updates or removal
    android.permission.MANAGE_EXTERNAL_STORAGE: needed on higher to access the OBB directory to download game files
    android.permission.READ_EXTERNAL_STORAGE: comes with WRITE_EXTERNAL_STORAGE
    android.permission.WRITE_EXTERNAL_STORAGE: needed on lower Android versions to access the OBB directory to download game files
    android.permission.INTERNET: needed to access PlayStore
    android.permission.USE_CREDENTIALS: needed log in to PlayStore to access e.g. apps you bought
  Status:
    - 2024-11-05 added on special request by mail despite already being on F-Droid (RB here but not there)
    - 2024-12-23 scanner reports MANAGE_EXTERNAL_STORAGE READ_EXTERNAL_STORAGE – https://gitlab.com/AuroraOSS/AuroraStore/-/issues/1251

