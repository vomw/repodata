  FlagIgnore:
    usesCleartextTraffic: used for (local) unencrypted Nextcloud / Mediawiki instances for Nextcloud/Wikipedia search
  IntentFilterIgnore:
    android.accessibilityservice.AccessibilityService: used for some gestures, to turn off screen, open notifications, …
  PermIgnore:
    android.permission.ACCESS_COARSE_LOCATION: used to retrieve local weather for the weather widget
    android.permission.ACCESS_FINE_LOCATION: used to retrieve local weather for the weather widget
    android.permission.ACCESS_MEDIA_LOCATION: used to show photo location on a map
    android.permission.QUERY_ALL_PACKAGES: used by the app’s search feature and app drawer
    android.permission.REQUEST_INSTALL_PACKAGES: used to install apk files when they occur as search results in file search
    android.permission.REQUEST_DELETE_PACKAGES: used to uninstall apps from the app drawer
    android.permission.READ_CALENDAR: used by the app’s search feature
    android.permission.READ_CONTACTS: used by the app’s search feature
    android.permission.READ_EXTERNAL_STORAGE: used for local file search
    android.permission.MANAGE_EXTERNAL_STORAGE: used for local file search
  NameSpaces:
    - /de/mm20/launcher2
    - /hct
    - /palettes
    - /scheme
    - /utils
