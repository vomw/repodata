  AppAdded: 2019-11-11
  Method: github-release
  GHSkipPre: 1
  Fastlane: https://github.com/TrackerControl/tracker-control-android/tree/master/fastlane/metadata/android
  FastlaneFeatures: title,video,shortdesc,fulldescMD,changelogs,screenshotsJPG,icon,featureGraphicJPG
  LibIgnore:
    - /org/acra
  IntentFilterIgnore:
    android.net.VpnService: needed to filter tracker access
  PermIgnore:
    android.permission.QUERY_ALL_PACKAGES: needed to list apps to filter trackers for
    android.permission.READ_PHONE_STATE: needed to disable the VPN on ongoing calls, to mitigate problems with VPN and Voice-over-IP service
    android.permission.CAMERA: to import WireGuard profiles by QR code
  Status:
