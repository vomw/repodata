MaintainerNotes:
  AppAdded: 2026-01-14
  Method: github-release
  GHSkipPre: 1
  ApkMatch: /fdroid-arm64-v8a/i
  ApkIgnore: /googleplay/i
  Fastlane: https://github.com/vitorpamplona/amethyst/tree/main/fastlane/metadata/android
  FastlaneFeatures: shortdesc,fulldescMD,icon,screenshotsJPG
  NameSpaces:
    - /com/vitorpamplona/ammolite
    - /com/vitorpamplona/nestsclient
    - /com/vitorpamplona/quartz
    - /com/vitorpamplona/quic
  FlagIgnore:
    usesCleartextTraffic: for using relays that are not secured, of which unfortunately there are plenty at Nostr
  PermIgnore:
    android.permission.ACCESS_COARSE_LOCATION: to (optionally) tag own posts with the current location
    android.permission.CAMERA: needed for the ingrated QR Code scanner
    android.permission.RECORD_AUDIO: to record (and then send) audio messages
    android.permission.READ_EXTERNAL_STORAGE: legacy, needed for some lower Android versions only
  Status:
    - 2023-01-13 originally added
    - 2023-01-29 v0.1.14 added MLKit, dragging in Firebase, GMS & Co so NonFreeNet,NonFreeDep,Tracking had to be added https://github.com/vitorpamplona/amethyst/issues/54
    - 2023-02-11 APK size now beyond 80 MB, sent another urgent warning and asking for per-ABI builds https://github.com/vitorpamplona/amethyst/issues/54#issuecomment-1426509975
    - 2023-02-21 next release, still 90 MB and still no answer on per-ABI, trackers, etc – so app is now removed until the issue was solved.
    - 2023-03-14 big effort with a foss build succeeded to remove all AFs and bring the "fat build" below 30 MB again, so the app is re-established.
    - 2023-04-16 now that it is on F-Droid, asked whether we shall keep it (reproducible build), see https://github.com/vitorpamplona/amethyst/issues/22#issuecomment-1510466217
    - 2023-04-29 removed as it reached F-Droid 2023-04-01
    - 2026-01-14 added back as F-Droid has archived it (saying they cannot build it anymore – it is RB here with us)
    - 2026-01-14 usesCleartextTraffic android.permission.READ_EXTERNAL_STORAGE – https://github.com/vitorpamplona/amethyst/issues/1670

