    android.accessibilityservice.AccessibilityService: for locking of the screen but double tap and opening power menu if configured
  PermIgnore:
    android.permission.QUERY_ALL_PACKAGES: to list all apps in the app drawer
    android.permission.REQUEST_DELETE_PACKAGES: to allow triggering uninstallation for apps from within the drawer
    android.permission.ACCESS_COARSE_LOCATION: to get the location to fetch weather details for
    android.permission.ACCESS_FINE_LOCATION: to get the location to fetch weather details for
    com.android.alarm.permission.SET_ALARM: used to open the default alarm app if no other clock app is set in the settings
    android.permission.PACKAGE_USAGE_STATS: to see usage of other apps to list last used apps first in the app list
    android.permission.READ_CONTACTS: needed for the Contact Search and Calling Functionality
