    - 2023-10-02 package name changed (.foss suffix added), discussing th switch over at https://github.com/XayahSuSuSu/Android-DataBackup/issues/102#issuecomment-1736704439
    - 2023-10-03 temporarily changing UCM Tags => Static so a proper switch-over can be prepared, see https://github.com/XayahSuSuSu/Android-DataBackup/issues/102#issuecomment-1744064894
    - 2023-10-06 once the app shows up at F-Droid, keep it here for a while. Wait for a final release with this applicationId, then give it a month overlap for folks to switch
    - 2024-07-07 scanner reports usesCleartextTraffic DEPENDENCY_INFO_BLOCK QUERY_ALL_PACKAGES READ_EXTERNAL_STORAGE MANAGE_EXTERNAL_STORAGE – https://github.com/XayahSuSuSu/Android-DataBackup/issues/257
    - 2024-07-08 moved from com.xayah.databackup
    - 2024-07-08 source of /com/xayah/libsardine cannot be found – https://github.com/XayahSuSuSu/Android-DataBackup/issues/259

