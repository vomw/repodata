  IntentFilterIgnore:
    android.accessibilityservice.AccessibilityService: see app description (this is an addon to make AS available to the main app)
  PermIgnore:
    android.permission.RECEIVE_SMS: to read SMS, required for the SMS/MMS Sensor event
    android.permission.RECEIVE_MMS: to read MMS, required for the SMS/MMS Sensor event
    android.permission.PROCESS_OUTGOING_CALLS: to check on outgoing calls, for the Call Sensor event
    android.permission.READ_CALL_LOG: to check on outgoing calls, for the Call Sensor event
    android.permission.READ_PHONE_STATE: to check on incoming calls, for the Call Sensor event
    android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS: to allow excepting the app from being suspended for battery optimizations
    sk.henrichg.phoneprofilesplusextender.ACCESSIBILITY_SERVICE_PERMISSION: the app’s own permission. Apps wanting access to it (e.g. PPP) must request it

