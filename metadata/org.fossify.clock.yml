    android.permission.SYSTEM_ALERT_WINDOW: needed to launch e.g. timer alerts from background
    android.permission.POST_NOTIFICATIONS: needed to show alarms etc. in the notification area
    android.permission.RECEIVE_BOOT_COMPLETED: needed to reschedule alarms on device start
    android.permission.SCHEDULE_EXACT_ALARM: needed to schedule alarms
    com.android.alarm.permission.SET_ALARM: needed on lower Android versions to schedule alarms
    android.permission.USE_FULL_SCREEN_INTENT: needed to open the main activity from a notification
    android.permission.USE_EXACT_ALARM: used in place of SCHEDULE_EXACT_ALARM on Android 13 and above
    android.permission.FOREGROUND_SERVICE: needed to keep things like the timer running in the background etc.

