  FastlaneFeatures: title,shortdesc,fulldescMD,changelogs,icon,screenshots
  DoubleList: keep
  PermIgnore:
    android.permission.READ_EXTERNAL_STORAGE: needed on lower Android versions to access the sounds to play as alarms
    android.permission.READ_MEDIA_AUDIO: needed on higher Android versions to access the sounds to play as alarms
    android.permission.NFC: needed to detect NFC tags
    android.permission.WAKE_LOCK: needed to prevent the phone from sleeping so that an activated alarm will continue to go off
    android.permission.RECEIVE_BOOT_COMPLETED: needed to restore alarms when the phone is turned on
    android.permission.SYSTEM_ALERT_WINDOW: needed to work around an Android-15 bug with foreground services
