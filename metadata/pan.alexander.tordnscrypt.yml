MaintainerNotes:
  AppAdded: 2019-12-07
  Method: github-release
  GHSkipPre: 1
  ApkIgnore: /(arm64|x86)/i
  Fastlane: https://github.com/Gedsh/InviZible/tree/master/fastlane/metadata/android
  FastlaneFeatures: shortdesc,fulldescMD,changelogs,icon,featureGraphicJPG,screenshotsJPG
  FastlaneIgnore: title
  Note: we need to override title here as we ship the Beta
  FlagIgnore:
    usesCleartextTraffic: Being a proxy, it needs to handle all traffic, including non-secured clear-text traffic (HTTP).
  IntentFilterIgnore:
    android.net.VpnService: The app implements a VPN service, as per the app’s description.
  PermIgnore:
    android.permission.QUERY_ALL_PACKAGES: needed to obtain a list of all apps for app-specific firewall rules
    android.permission.READ_EXTERNAL_STORAGE: required on older Android versions to import DNSCrypt blocklists and restore the app configuration from a backup
    android.permission.REQUEST_INSTALL_PACKAGES: this BETA release contains a self-updater pulling directly from Github releases, which can be turned off in the app’s settings
    android.permission.NEARBY_WIFI_DEVICES: required on Android 17+ to exclude local traffic from being forwarded to remote services
  Status:
    - 2024-01-25 scanner reported android.permission.READ_EXTERNAL_STORAGE android.permission.REQUEST_INSTALL_PACKAGES android.permission.QUERY_ALL_PACKAGES – https://github.com/Gedsh/InviZible/issues/243
    - 2024-01-26 author doesn’t want to make the installer opt-in as fast updates are essential for a beta version (which is what we have here). Hence the permission was added to PermIgnore without a reason specified, so the warning won’t pop up with the scans while the permission is still shown in warning colors.
    - 2026-05-04 NEARBY_WIFI_DEVICES – https://github.com/Gedsh/InviZible/issues/433

