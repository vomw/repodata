  ApkMatch: /droidvim/i
  FlagIgnore:
    usesCleartextTraffic: used for communication with a web browser invoked via Vim commands
  PermIgnore:
    android.permission.READ_MEDIA_IMAGES: used to view local images ("binary viewer")
    android.permission.READ_MEDIA_AUDIO: used to view local audio files ("binary viewer")
    android.permission.READ_MEDIA_VIDEO: used to view local video files ("binary viewer")
    android.permission.READ_EXTERNAL_STORAGE: used to view other local files ("binary viewer")
    android.permission.MANAGE_EXTERNAL_STORAGE: needed as DroidVim runs on the shell and needs to access storage from there
    android.permission.QUERY_ALL_PACKAGES: used for the app launcher button
