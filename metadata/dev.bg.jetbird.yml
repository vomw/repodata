MaintainerNotes:
  AppAdded: 2024-10-07
  Method: codeberg-release
  GHSkipPre: 1
  ApkMatch: /armeabi-v7a/i
  Fastlane: https://codeberg.org/bg443/JetBird/src/branch/master/fastlane/metadata/android
  FastlaneFeatures: title,shortdesc,fulldescMD,changelogs,icon,screenshots
  DoubleList: keep
  IntentFilterIgnore:
    android.net.VpnService: this is a VPN app.
  PermIgnore:
    android.permission.QUERY_ALL_PACKAGES: to be able to choose which apps aren’t tunneled
    android.permission.ACCESS_NETWORK_STATE: used to monitor network to check if VPN is already running etc.
    android.permission.CHANGE_NETWORK_STATE: used to monitor network to check if VPN is already running etc.
    android.permission.POST_NOTIFICATIONS: used for notifications when JetBird is running and when upstream sends new routes
    android.permission.RECEIVE_BOOT_COMPLETED: used to start the tunnel when the device reboots; opt-in via settings
    android.permission.FOREGROUND_SERVICE: used to run the VPN service
    android.permission.FOREGROUND_SERVICE_SYSTEM_EXEMPTED: used to run the VPN service

