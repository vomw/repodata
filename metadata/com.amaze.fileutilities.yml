  PermIgnore:
    android.permission.READ_EXTERNAL_STORAGE: needed for file management
    android.permission.MANAGE_EXTERNAL_STORAGE: needed for file management on higher Android versions
    android.permission.QUERY_ALL_PACKAGES: needed to show/group apps
    android.permission.ACCESS_FINE_LOCATION: needed to identify nearby devices for transfer tab
    android.permission.ACCESS_COARSE_LOCATION: needed to identify nearby devices for transfer tab
    android.permission.REQUEST_DELETE_PACKAGES: needed by analysis manager to uninstall apps
    android.permission.READ_PHONE_STATE: needed to generate unique identifier (device id) for a device that persists even when device is cleaned. This is used to manage user’s purchase / subscription without capturing their private data such as email id.
