  IntentFilterIgnore:
    android.accessibilityservice.AccessibilityService: needed for remote control with a mouse/touch device, see app description
  PermIgnore:
    android.permission.MANAGE_EXTERNAL_STORAGE: used to allow file transfers to/from the Android device to the remote device
    android.permission.READ_EXTERNAL_STORAGE: used to allow file transfers to/from the Android device to the remote device
    android.permission.RECORD_AUDIO: used to record audio from the Android device to the remote device
    android.permission.SYSTEM_ALERT_WINDOW: used to capture the Android device‘s screen and send that to the remote device
    android.permission.RECEIVE_BOOT_COMPLETED: for service auto-start and for handling notification from the device that the device has booted successfully
