  FastlaneFeatures: title,shortdesc,fulldescMD,changelogs,icon,featureGraphic,screenshots
  NameSpaces:
    - /com/catpuppyapp/puppygit
  IntentFilterIgnore:
    android.accessibilityservice.AccessibilityService: to recieve app change events, detecting enter/exit an app
  PermIgnore:
    android.permission.READ_EXTERNAL_STORAGE: to allow managing local repos anywhere on local storage
    android.permission.WRITE_EXTERNAL_STORAGE: to allow managing local repos anywhere on local storage
    android.permission.MANAGE_EXTERNAL_STORAGE: to allow managing local repos anywhere on local storage
    android.permission.QUERY_ALL_PACKAGES: to obtain a list of available apps to pick from to enable auto pull/push when entering/leaving them
  Status:
    - 2024-11-01 repo was moved from https://github.com/Bandeapart1964/PuppyGit by creating a new one, so no redirect. Original repo contains note for the move, so it is legit. Also, reported by the dev themselves at https://gitlab.com/IzzyOnDroid/repo/-/issues/642
    - 2025-02-02 scanner reports android.accessibilityservice.AccessibilityService QUERY_ALL_PACKAGES – https://github.com/catpuppyapp/PuppyGit/issues/30
    - 2025-07-19 upstreamed local fastlane adjustments via https://github.com/catpuppyapp/PuppyGit/pull/79

