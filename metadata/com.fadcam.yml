  PermIgnore:
    android.permission.BLUETOOTH_SCAN: to allow using an external microphone via Bluetooth
    android.permission.CAMERA: required for video recording
    android.permission.RECORD_AUDIO: required to include audio with the recordings
    android.permission.READ_EXTERNAL_STORAGE: implicitly granted due to the write permission
    android.permission.WRITE_EXTERNAL_STORAGE: used to store the recordings
    android.permission.READ_MEDIA_VIDEO: needed to access videos on-device
    android.permission.ACCESS_FINE_LOCATION: used for the watermarking feature
    android.permission.ACCESS_COARSE_LOCATION: used for the watermarking feature
