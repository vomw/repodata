MaintainerNotes:
  AppAdded: 2024-12-01
  Method: github-release
  ApkMatch: /libre\.apk$/i
  GHSkipPre: 1
  NameSpaces:
    - /com/kunzisoft/keepass
    - /com/kunzisoft/encrypt
  Fastlane: https://github.com/Kunzisoft/KeePassDX/tree/master/fastlane/metadata/android
  FastlaneFeatures: shortdesc,fulldescMD,changelogs,featureGraphic,screenshots
  FastlaneIgnore: title
  Note: title has to be skipped so libre/free can be differentiated
  IntentFilterIgnore:
    android.view.InputMethod: needed for the auto-type functionality (Magikeyboard)
  PermIgnore:
    android.permission.QUERY_ALL_PACKAGES: used to open applications directly from their applicationId from an "AndroidApp" field
    android.permission.FOREGROUND_SERVICE: needed to keep database operations working when the app itself is not in foreground
    android.permission.POST_NOTIFICATIONS: needed to post notifications
    android.permission.SCHEDULE_EXACT_ALARM: needed to manage timers for database closing
    android.permission.USE_BIOMETRIC: enables biometric/fingerprint recognition
    android.permission.USE_FINGERPRINT: enables fingerprint recognition for old devices
    android.permission.VIBRATE: to allow vibration at events, rarely used
  DoubleList: keep
  DoubleListRef: https://gitlab.com/IzzyOnDroid/repo/-/issues/671
  Status:
