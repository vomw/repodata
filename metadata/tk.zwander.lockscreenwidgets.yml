AutoName: Lockscreen Widgets and Drawer
ArchivePolicy: 1

MaintainerNotes:
  AppAdded: 2025-11-01
  Method: github-release
  GHSkipPre: 1
  ApkMatch: /WidgetsAnywhere.*\.apk/
  Fastlane: https://github.com/zacharee/LockscreenWidgets/tree/master/fastlane/metadata/android
  FastlaneFeatures: shortdesc,fulldescMD,icon,featureGraphic,screenshots
  Note: Fastlane is our starter package
  NameSpaces:
    - /dev/zwander/lswinterconnect
    - /tk/zwander/common
    - /tk/zwander/widgetdrawer
  IntentFilterIgnore:
    android.accessibilityservice.AccessibilityService: to display on the lock screen and in the notification center
  PermIgnore:
    android.permission.VIBRATE: used for haptic feedback
    android.permission.DISABLE_KEYGUARD: to prompt to dismiss the lock screen when needed
    android.permission.READ_EXTERNAL_STORAGE: needed on Android 12 and earlier to get the wallpaper for Masked Frame Mode
    android.permission.QUERY_ALL_PACKAGES: to display the list of available widgets, as well as interact with the widgets as needed
    android.permission.CALL_PHONE: only requested if needed (e.g., when tapping a direct dial shortcut)
  Status:
    - 2025-11-02 upstreaming our local Fastlane metadata via https://github.com/zacharee/LockscreenWidgets/pull/83
    - 2026-07-22 file naming pattern changed, and a beta is marked as release. Before picking that up, asking upstream if it was intentional at https://github.com/zacharee/LockscreenWidgets/issues/203

