name: App Inclusion Request
description: 'This template is for requesting a new app to be added to our repository'
title: '[AppRequest] <App Name>'
labels:
  - 'app-request'
  - 'needs/on-device-test'
  - 'needs/apk-scan'
body:
  - type: checkboxes
    attributes:
      label: Guidelines
      description: Please ensure you've completed all of the following.
      options:
        - label: I am the developer of the app. (If not, please explain the developer's stance on this inclusion request in the Further Notices section.)
          required: false
        - label: The app complies with the [App Inclusion Policy](https://izzyondroid.org/docs/general/AppInclusionPolicy/).
          required: false
        - label: The app is not already listed in the repo or issue tracker.
          required: true
        - label: The [Fastlane](https://izzyondroid.org/docs/general/Fastlane/) folder is available in the app's repo.
          required: false

  - type: markdown
    attributes:
      value: |
        ---
        ### App meta-data

  - type: input
    id: source-code
    attributes:
      label: 'Link to the source code'
      description: Provide a direct link to the app's source code repository.
      placeholder: 'https://github.com/...'
    validations:
      required: true

  - type: input
    id: app-store
    attributes:
      label: 'Link to app in another app store'
      description: 'If available, provide a link to the app in another app store (e.g., Google Play, F-Droid)'
      placeholder: 'https://play.google.com/...'
    validations:
      required: false

  - type: input
    id: license
    attributes:
      label: 'License used'
      description: 'Specify the license under which the app is distributed'
      placeholder: 'GPL-3.0, MIT, Apache-2.0, etc.'
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: 'Categories'
      description: 'Select all applicable categories for the app (at least one, max 5)'
      multiple: true
      options:
        - Automation
        - Connectivity
        - Development
        - Food
        - Games
        - Graphics
        - Internet
        - Messaging
        - Money
        - Multimedia
        - Navigation
        - Office
        - Phone & SMS
        - Reading
        - Religion
        - Science & Education
        - Security
        - Social Network
        - Sports & Health
        - System
        - Theming
        - Time
        - Weather
        - Writing
        - Xposed
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: 'Summary'
      description: 'Provide a brief summary of the app (1-2 sentences)'
      placeholder: 'A short description of the app...'
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 'Description'
      description: 'Provide a detailed description of the app'
      placeholder: 'A detailed description of the app, its features, and its purpose...'
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ---
        ### Technical instructions

  - type: textarea
    id: build-instructions
    attributes:
      label: 'Build instructions'
      description: 'Provide clear instructions on how to build the app from source'
      placeholder: 'Step-by-step instructions for building the app...'
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ---
        ### AI Tools Usage
        *If any "AI" tools were used during the development of this app, please fill the following fields below.*

  - type: dropdown
    id: ai-assistance-level
    attributes:
      label: 'Assistance Level'
      description: 'How extensively were the "AI" tools used?'
      options:
        - 'None – No "AI" tools were used'
        - 'Minimal – Occasional suggestions or lookups'
        - 'Moderate – Used for specific tasks or modules'
        - 'Substantial – Used throughout development'
        - 'Dominant – Most code or content was "AI"-generated'
    validations:
      required: false

  - type: input
    id: ai-tool
    attributes:
      label: '"AI" Tool(s)'
      description: 'Name of the "AI" tool(s) used during development (e.g., ChatGPT, Claude, Ollama, OpenCode)'
      placeholder: 'e.g., Claude'
    validations:
      required: false

  - type: textarea
    id: ai-usage-description
    attributes:
      label: 'What did the tools help with?'
      description: 'Briefly describe what the tools were used for (e.g., brainstorming, boilerplate generation, architecture, UI-design, debugging, documentation, vibe-coding)'
      placeholder: 'e.g., helped debug a concurrency issue.'
    validations:
      required: false

  - type: checkboxes
    id: ai-accountability
    attributes:
      label: 'AI Accountability'
      description: 'Please confirm the following regarding "AI"-generated contributions.'
      options:
        - label: 'The human developer(s) reviewed and edited all "AI"-generated outputs'
          required: false
        - label: 'The human developer(s) ran manual tests and manually verified all changes'
          required: false

  - type: textarea
    id: applicant-notice
    attributes:
      label: 'Further Notices'
      description: 'For example, if you are not the developer of the app or would like to explain certain aspects of the app, that may affect its inclusion. Please include any relevant links or references.'
      placeholder: 'e.g., "I am a user/contributor of this app. The developer is aware and supportive of this request as seen in the following issue: <Link to issue>."'
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        **Reminder:** Please don't forget to include the app's name in the issue title.

        **Thanks for requesting a new app! We will review your request and get back to you soon enough.**