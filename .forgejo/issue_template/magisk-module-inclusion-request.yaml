name: 'Magisk Module Inclusion'
description: 'This template is for requesting to include a new Magisk module with our Magisk repository, or to update its Metadata'
title: '[Magisk] <Module Name>'
labels:
  - 'magisk'
body:
  - type: markdown
    attributes:
      value: |
        ---
        ### Module meta-data

  - type: input
    id: source-code
    attributes:
      label: 'Link to the source code'
      description: 'Provide a direct link to the Magisk module''s source code repository'
      placeholder: 'https://github.com/...'
    validations:
      required: true

  - type: input
    id: license
    attributes:
      label: 'License used'
      description: 'Specify the license under which the Magisk module is distributed'
      placeholder: 'GPL-3.0, MIT, Apache-2.0, etc.'
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: 'Categories'
      description: 'Select all applicable categories for the Magisk module (at least one, max 5)'
      multiple: true
      options:
        - Automation
        - Connectivity
        - Development
        - Food
        - Games
        - Graphics
        - Internet
        - Messaging
        - Money
        - Multimedia
        - Navigation
        - Office
        - Phone & SMS
        - Reading
        - Religion
        - Science & Education
        - Security
        - Social Network
        - Sports & Health
        - System
        - Theming
        - Time
        - Weather
        - Writing
        - Xposed
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: 'Summary'
      description: 'Provide a brief summary of the Magisk module (1-2 sentences)'
      placeholder: 'A short description of the module...'
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 'Description'
      description: 'Provide a detailed description of the Magisk module, its purpose, and its features'
      placeholder: 'A detailed description of the module, its functionality, and any special instructions...'
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ---
        ### AI Tools Usage
        *If any "AI" tools were used during the development of this Magisk module, please fill in the fields below. This section is optional but encouraged for transparency.*

  - type: dropdown
    id: ai-assistance-level
    attributes:
      label: 'Assistance Level'
      description: 'How extensively were the "AI" tools used?'
      options:
        - 'None – No "AI" tools were used'
        - 'Minimal – Occasional suggestions or lookups'
        - 'Moderate – Used for specific tasks or modules'
        - 'Substantial – Used throughout development'
        - 'Dominant – Most code or content was "AI"-generated'
    validations:
      required: false

  - type: input
    id: ai-tool
    attributes:
      label: '"AI" Tool(s)'
      description: 'Name of the "AI" tool(s) used during development (e.g., ChatGPT, Claude, Ollama, OpenCode)'
      placeholder: 'e.g., Claude'
    validations:
      required: false

  - type: textarea
    id: ai-usage-description
    attributes:
      label: 'What did the tools help with?'
      description: 'Briefly describe what the tools were used for (e.g., brainstorming, boilerplate generation, architecture, UI-design, debugging, documentation, vibe-coding)'
      placeholder: 'e.g., helped debug a concurrency issue.'
    validations:
      required: false

  - type: checkboxes
    id: ai-accountability
    attributes:
      label: 'AI Accountability'
      description: 'Please confirm the following regarding "AI"-generated contributions.'
      options:
        - label: 'The human developer(s) reviewed and edited all "AI"-generated outputs'
          required: false
        - label: 'The human developer(s) ran manual tests and manually verified all changes'
          required: false

  - type: markdown
    attributes:
      value: |
        **Reminder:** Please don't forget to include the module's name in the issue title.

        **Thanks for requesting a new Magisk module! We will review your request and get back to you soon enough.**